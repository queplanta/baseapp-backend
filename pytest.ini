[pytest]
DJANGO_SETTINGS_MODULE = testproject.settings
# -- recommended but optional:
python_files = tests.py test_*.py *_tests.py

# The flattened packages are tested as an integrated project below. Their source
# directories contain standalone suites that need their own test settings and
# would otherwise be collected a second time with testproject.settings.
addopts = --ignore=baseapp-auth/baseapp_auth/tests --ignore=baseapp-e2e/baseapp_e2e/tests --ignore=baseapp-reactions/baseapp_reactions/tests --ignore=baseapp-social-auth/baseapp_social_auth/tests --ignore=baseapp-drf-view-action-permissions/baseapp_drf_view_action_permissions/tests
